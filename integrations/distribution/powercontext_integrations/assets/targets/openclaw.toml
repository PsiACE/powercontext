schema_version = 1
label = "OpenClaw"
order = 4
target = "openclaw"
kind = "agent_host"
language = "typescript"
source = "integrations/openclaw/plugins/memory-powercontext"

[[hooks]]
event = "before_prompt_build"
handler = "src/lifecycle.ts:before_prompt_build"

[[hooks]]
event = "agent_end"
handler = "src/lifecycle.ts:agent_end"

[[hooks]]
event = "before_compaction"
handler = "src/lifecycle.ts:before_compaction"

[[hooks]]
event = "session_end"
handler = "src/lifecycle.ts:session_end"

[setup]
module = "openclaw"
options = ["server_url", "allow_insecure_http"]
verifies = true
executable = "openclaw"

[setup.settings]
environment_prefix = ""
server_setting = "endpoint"
authorization_setting = ""
capture_setting = "autoCapture"
scope_setting = "scopeId"
context_assembly_setting = "contextAssembly"
